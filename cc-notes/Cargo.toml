[package]
name = "clipvault-notes"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "cc-side ClipVault notes/memory facade over the notebase engine"
license = "MIT"

[dependencies]
notebase = { git = "https://github.com/DavidMusk93/notebase.git" }
notebase-store = { git = "https://github.com/DavidMusk93/notebase.git" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
urlencoding = "2"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
