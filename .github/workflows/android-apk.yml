name: Android APK

on:
  push:
    branches: ["master"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build · ClipVault Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute
        run: chmod +x gradlew

      - name: Version from tag / sha
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
            CODE=$(echo "$NAME" | awk -F. '{print ($1*10000)+($2*100)+($3+0)}')
          else
            NAME="0.1.0-${GITHUB_SHA::7}"
            CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Assemble debug + release
        env:
          CLIPVAULT_VERSION_NAME: ${{ steps.ver.outputs.name }}
          CLIPVAULT_VERSION_CODE: ${{ steps.ver.outputs.code }}
          CLIPVAULT_STORE_PASSWORD: keepsake-ci
          CLIPVAULT_KEY_PASSWORD: keepsake-ci
          CLIPVAULT_KEY_ALIAS: keepsake
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/clipvault-${{ steps.ver.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/clipvault-${{ steps.ver.outputs.name }}-release.apk"
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-android-${{ steps.ver.outputs.name }}
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/dist/clipvault-*-release.apk
            android/dist/clipvault-*-debug.apk
          generate_release_notes: true
          body: |
            ClipVault Android — 备份阅读器 + 主动粘贴/分享。

            安装 release APK 后：选择 Google Drive 中的 `ClipVault/backup`（兼容 `Keepsake/backup`）目录即可。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
