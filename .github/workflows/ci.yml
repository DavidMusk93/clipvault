name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    name: Swift · ClipVaultServer
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          node --version
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          # Do not cache .build: PCH embeds the checkout path
          # (/Users/runner/work/<repo>/<repo>). After ClipView → clipvault
          # that restored a ModuleCache for the old path and failed with
          # "missing required module 'SwiftShims'".
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-clipvault-${{ hashFiles('Package.swift', 'Sources/ClipVault/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-clipvault-
      - name: Build (debug)
        run: |
          rm -rf .build
          swift build --product ClipVaultServer
      - name: Build (release)
        run: swift build -c release --product ClipVaultServer
      - name: Verify binary
        run: |
          BIN=".build/release/ClipVaultServer"
          test -x "$BIN"
          ls -lh "$BIN"
          file "$BIN"
      - name: Swift snippet tests
        run: ./scripts/check-frontend.sh

  frontend-tests:
    name: Web · unit regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install test deps (jsdom)
        run: npm ci --no-audit --no-fund
      - name: Run node tests
        run: node --test tests/*.test.mjs

  rust-http:
    name: Rust · clipvault-http
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            http-front/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('http-front/Cargo.lock') }}
      - name: Test + release build
        working-directory: http-front
        run: |
          cargo test
          cargo build --release

  android-apk:
    name: Android · assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-ci-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ci-
      - name: Assemble release APK
        env:
          CLIPVAULT_VERSION_NAME: 0.1.0-ci
          CLIPVAULT_VERSION_CODE: ${{ github.run_number }}
          KEEPSAKE_VERSION_NAME: 0.1.0-ci
          KEEPSAKE_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: clipvault-android-ci-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
