  <style>
    :root {
      --bg: #f5f5f7;
      --rail: #f2f2f7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --separator: rgba(60, 60, 67, 0.12);
      --card: #ffffff;
      --accent: #0071e3;

    input[type="search"] {
      width: 100%;

      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
    }
    input:focus { outline: none; background: #fff; }
    .card {
      --tone: var(--system);
      --vol-a: 0.14;
      position: relative;
      padding: 10px 10px 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      min-width: 0;
      background: color-mix(in srgb, var(--tone) 11%, transparent);
      box-shadow: inset 3px 0 0 color-mix(in srgb, var(--tool) calc(var(--vol-a) * 100%), transparent);

    }
    @media (hover: hover) and (pointer: fine) {

      font-weight: 600;

      height: 24px;
      border: 0;
      border-radius: 8px;

      display: inline-flex;

    .card.is-pinned .pin-btn .pin-off { display: none; }
    .pin-btn:active { transform: scale(0.94); }
    @media (hover: hover) and (pointer: fine) {
      .pin-btn:hover { background: rgba(120, 120, 128, 0.12); color: var(--ink); }
      .card.is-pinned .pin-btn:hover { background: rgba(0, 113, 227, 0.12); color: var(--accent); }

    }

    .tool-fold summary {

    }
    .tool-head {

      align-items: center;
      gap: 8px;

    }

      --mine-loss-soft: rgba(194, 65, 12, 0.13);
      --mine-good: #2e7d32;
      --mine-good-soft: rgba(46, 125, 50, 0.13);
      --mine-user: var(--honey);
      --mine-user-soft: var(--honey-soft);
      --mine-agent: var(--accent);
      --mine-agent-soft: rgba(0, 113, 227, 0.10);
      --mine-flat: rgba(60, 60, 67, 0.08);
      position: absolute;
      inset: 8px 8px 52px 8px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #fafafa;
      /* Opaque cover: any blur here would recompute on every hook behind the sheet. */
      border: 0.5px solid var(--separator);
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.16);
      color: var(--ink);
    }
    .cv-mine-sheet[hidden] { display: none !important; }
    .cv-mine-sheet .mine-head {
      flex: 0 0 auto;
      padding: 12px 16px 10px;
      border-bottom: 0.5px solid var(--separator);
      background: #fff;
      border-radius: 16px 16px 0 0;
    }
    .cv-mine-sheet .mine-head-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .cv-mine-sheet h2 {
      flex: 1;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .cv-mine-sheet .mine-sum {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      margin: 0 0 8px;
    }
    .cv-mine-sheet .mine-sum b { color: var(--ink); font-weight: 650; }
    .cv-mine-sheet .mine-flag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 980px;
      font-size: 11px;
      font-weight: 650;
    }
    .cv-mine-sheet .mine-flag.warn { background: var(--mine-loss-soft); color: var(--mine-loss); }
    .cv-mine-sheet .mine-flag.base { background: var(--mine-flat); color: var(--muted); font-weight: 500; }
    .cv-mine-sheet .mine-flag.est { background: var(--mine-money-soft); color: var(--mine-money); }
    .cv-mine-sheet .mine-scopes,
    .cv-mine-sheet .mine-dirs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 6px;
    }
    .cv-mine-sheet .mine-chip {
      height: 24px;
      padding: 0 9px;
      border-radius: 980px;
      border: 0.5px solid rgba(60, 60, 67, 0.22);
      background: transparent;
      color: var(--ink);
      font: 600 11.5px/23px inherit;
      cursor: pointer;
    }
    .cv-mine-sheet .mine-chip:hover { background: rgba(120, 120, 128, 0.10); }
    .cv-mine-sheet .mine-chip.is-on {
      color: var(--honey);
      border-color: var(--honey);
      background: var(--honey-soft);
    }
    .cv-mine-sheet .mine-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 12px 16px 24px;
      scroll-behavior: smooth;
    }

    /* section frame ------------------------------------------------------ */
    .cv-mine-sheet .mine-sec { margin: 0 0 20px; scroll-margin-top: 44px; }
    .cv-mine-sheet .mine-sec-h {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cv-mine-sheet .mine-sec-h .mine-count {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 980px;
      background: rgba(60, 60, 67, 0.10);
      font-size: 11px;
      line-height: 18px;
      text-align: center;
    }
    .cv-mine-sheet .mine-sec-h .mine-hint {
      margin-left: auto;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      font-size: 11px;
    }
    .cv-mine-sheet .mine-nav {
      position: sticky;
      top: -12px;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: -4px 0 14px;
      padding: 8px 0 6px;
      /* Opaque: a translucent sticky bar shows scrolled content through it. */
      background: #fafafa;
    }
    .cv-mine-sheet .mine-nav button {
      height: 22px;
      padding: 0 9px;
      border-radius: 980px;
      border: 0.5px solid var(--separator);
      background: #fff;
      color: var(--muted);
      font: 600 11px/21px inherit;
      cursor: pointer;
    }
    .cv-mine-sheet .mine-nav button:hover { color: var(--ink); border-color: rgba(60, 60, 67, 0.3); }

    /* verdict ------------------------------------------------------------ */
    .cv-mine-sheet .mine-verdict {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px 16px;
      padding: 14px 16px;
      margin: 0 0 12px;
      border-radius: 16px;
      background: #fff;
      border: 0.5px solid var(--separator);
    }
    .cv-mine-sheet .mine-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 66px;
      padding-right: 16px;
      border-right: 0.5px solid var(--separator);
    }
    .cv-mine-sheet .mine-score b {
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .cv-mine-sheet .mine-score span { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .cv-mine-sheet .mine-verdict.g-good .mine-score b { color: var(--mine-good); }
    .cv-mine-sheet .mine-verdict.g-ok .mine-score b { color: var(--mine-user); }
    .cv-mine-sheet .mine-verdict.g-warn .mine-score b { color: var(--mine-loss); }
    .cv-mine-sheet .mine-verdict.g-bad .mine-score b { color: #b91c1c; }
    .cv-mine-sheet .mine-kpis {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      align-content: start;
      min-width: 0;
    }
    .cv-mine-sheet .mine-kpi { display: flex; flex-direction: column; min-width: 62px; }
    .cv-mine-sheet .mine-kpi b {
      font-size: 16px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      color: var(--ink);
    }
    .cv-mine-sheet .mine-kpi b.t-time { color: var(--mine-time); }
    .cv-mine-sheet .mine-kpi b.t-money { color: var(--mine-money); }
    .cv-mine-sheet .mine-kpi b.t-loss { color: var(--mine-loss); }
    .cv-mine-sheet .mine-kpi b.t-good { color: var(--mine-good); }
    .cv-mine-sheet .mine-kpi span { font-size: 11px; color: var(--muted); }
    .cv-mine-sheet .mine-kpi em { font-style: normal; font-size: 10.5px; color: var(--muted); }
    .mine-kpi em.up { color: var(--mine-loss); }
    .mine-kpi em.down { color: var(--mine-good); }
    .cv-mine-sheet .mine-compose { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
    .cv-mine-sheet .mine-bar-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
    .cv-mine-sheet .mine-bar-row > span:first-child { width: 58px; flex: 0 0 auto; font-weight: 650; }
    .cv-mine-sheet .mine-stack {
      flex: 1 1 auto;
      display: flex;
      height: 14px;
      min-width: 0;
      border-radius: 7px;
      overflow: hidden;
      background: var(--mine-flat);
    }
    .cv-mine-sheet .mine-stack i { display: block; min-width: 2px; }
    .cv-mine-sheet .mine-stack i.s-work { background: var(--mine-time); }
    .cv-mine-sheet .mine-stack i.s-wait { background: rgba(60, 60, 67, 0.35); }
    .cv-mine-sheet .mine-stack i.s-fail { background: var(--mine-loss); }
    .cv-mine-sheet .mine-stack i.s-out { background: var(--mine-money); }
    .cv-mine-sheet .mine-stack i.s-cw { background: var(--mine-user); }
    .cv-mine-sheet .mine-stack i.s-cr { background: rgba(47, 143, 131, 0.35); }
    .cv-mine-sheet .mine-legend { display: flex; gap: 10px; font-size: 10.5px; color: var(--muted); margin-left: 66px; }
    .cv-mine-sheet .mine-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; }

    /* losses ------------------------------------------------------------- */
    .cv-mine-sheet .mine-loss {
      border-radius: 14px;
      padding: 12px 14px;
      margin: 0 0 10px;
      background: #fff;
      border: 0.5px solid var(--separator);
      border-left: 3px solid rgba(60, 60, 67, 0.22);
      scroll-margin-top: 44px;
    }
    .cv-mine-sheet .mine-loss.sev-high { border-left-color: var(--mine-loss); background: linear-gradient(180deg, var(--mine-loss-soft), #fff 46%); }
    .cv-mine-sheet .mine-loss.sev-med { border-left-color: var(--honey); background: linear-gradient(180deg, var(--honey-soft), #fff 46%); }
    .cv-mine-sheet .mine-loss.sev-good { border-left-color: var(--mine-good); background: linear-gradient(180deg, var(--mine-good-soft), #fff 46%); }
    .cv-mine-sheet .mine-loss-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .cv-mine-sheet .mine-loss-h h4 { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
    .cv-mine-sheet .mine-rank {
      width: 18px; height: 18px;
      flex: 0 0 auto;
      border-radius: 980px;
      background: rgba(60, 60, 67, 0.10);
      font-size: 10.5px;
      line-height: 18px;
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .cv-mine-sheet .mine-sev {
      flex: 0 0 auto;
      padding: 1px 6px;
      border-radius: 980px;
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: 0.03em;
    }
    .cv-mine-sheet .sev-high .mine-sev { background: var(--mine-loss-soft); color: var(--mine-loss); }
    .cv-mine-sheet .sev-med .mine-sev { background: var(--honey-soft); color: var(--honey); }
    .cv-mine-sheet .sev-note .mine-sev { background: rgba(60, 60, 67, 0.10); color: var(--muted); }
    .cv-mine-sheet .sev-good .mine-sev { background: var(--mine-good-soft); color: var(--mine-good); }
    .cv-mine-sheet .mine-impact {
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
      color: var(--muted);
      text-align: right;
    }
    .cv-mine-sheet .mine-impact b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); }
    .cv-mine-sheet .mine-impact b.usd { color: var(--mine-money); }
    .cv-mine-sheet .mine-metric {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 0 0 8px;
      padding: 6px 8px;
      border-radius: 9px;
      background: rgba(120, 120, 128, 0.07);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .cv-mine-sheet .mine-metric .k { font-weight: 650; color: var(--ink); }
    .cv-mine-sheet .mine-metric .now { font-weight: 650; color: var(--mine-loss); }
    .cv-mine-sheet .mine-metric.good .now { color: var(--mine-good); }
    .cv-mine-sheet .mine-metric .tgt { font-weight: 650; }
    .cv-mine-sheet .mine-metric .delta { margin-left: auto; }
    .cv-mine-sheet .mine-metric .delta.bad { color: var(--mine-loss); }
    .cv-mine-sheet .mine-metric .delta.good { color: var(--mine-good); }
    .cv-mine-sheet .mine-track {
      position: relative;
      flex: 0 0 90px;
      height: 6px;
      border-radius: 3px;
      background: rgba(120, 120, 128, 0.18);
      overflow: hidden;
    }
    .cv-mine-sheet .mine-track i { position: absolute; inset: 0 auto 0 0; width: var(--v, 0%); background: var(--mine-loss); }
    .cv-mine-sheet .mine-metric.good .mine-track i { background: var(--mine-good); }
    .cv-mine-sheet .mine-claim { margin: 0 0 6px; font-size: 13px; line-height: 1.5; }
    .cv-mine-sheet .mine-line { margin: 0 0 3px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
    .cv-mine-sheet .mine-line b { color: var(--ink); font-weight: 650; margin-right: 4px; }
    .cv-mine-sheet .mine-line.action b { color: var(--mine-agent); }
    .cv-mine-sheet .mine-line.gate b { color: var(--mine-user); }
    .cv-mine-sheet .mine-refs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .cv-mine-sheet .mine-ref {
      max-width: 100%;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 7px;
      border: 0.5px solid var(--separator);
      background: #fff;
      color: var(--muted);
      font: 500 11px/1.5 var(--font-mono);
      cursor: pointer;
      text-align: left;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .cv-mine-sheet .mine-ref:hover { color: var(--ink); border-color: var(--mine-agent); }
    .cv-mine-sheet .mine-ref.is-hit { border-color: var(--mine-agent); background: var(--mine-agent-soft); color: var(--mine-agent); }

    /* turn timeline ------------------------------------------------------ */
    .cv-mine-sheet .mine-turns { display: flex; flex-direction: column; gap: 5px; }
    .cv-mine-sheet .mine-turn {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      text-align: left;
      padding: 8px 10px 8px 12px;
      border-radius: 11px;
      border: 0.5px solid var(--separator);
      border-left: 3px solid var(--mine-time);
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      scroll-margin-top: 44px;
    }
    .cv-mine-sheet .mine-turn:hover { border-color: rgba(60, 60, 67, 0.3); }
    .cv-mine-sheet .mine-turn.is-open { background: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08); }
    .cv-mine-sheet .mine-turn.ph-implement { border-left-color: var(--mine-user); }
    .cv-mine-sheet .mine-turn.ph-review { border-left-color: #6e56cf; }
    .cv-mine-sheet .mine-turn.ph-debug { border-left-color: #c62828; }
    .cv-mine-sheet .mine-turn.ph-ship { border-left-color: var(--mine-good); }
    .cv-mine-sheet .mine-turn.ph-taste { border-left-color: #1565c0; }
    .cv-mine-sheet .mine-turn-h { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; }
    .cv-mine-sheet .mine-turn-h b { font-variant-numeric: tabular-nums; }
    .cv-mine-sheet .mine-turn-h em { font-style: normal; font-weight: 650; color: var(--muted); }
    .cv-mine-sheet .mine-turn-h i { font-style: normal; color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
    .cv-mine-sheet .mine-turn-stat { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cv-mine-sheet .mine-turn-p {
      grid-column: 1 / -1;
      min-width: 0;
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .cv-mine-sheet .mine-turn-bar {
      grid-column: 1 / -1;
      height: 6px;
      border-radius: 3px;
      background: var(--mine-flat);
      overflow: hidden;
    }
    .cv-mine-sheet .mine-turn-bar i { display: block; height: 100%; background: var(--mine-time); border-radius: 3px; }
    .cv-mine-sheet .mine-turn.has-fail .mine-turn-bar i { background: var(--mine-loss); }
    .cv-mine-sheet .mine-turn-detail {
      margin: -2px 0 6px;
      padding: 10px 12px;
      border-radius: 0 0 11px 11px;
      border: 0.5px dashed var(--separator);
      border-top: 0;
      background: #fff;
      font-size: 12px;
    }
    .cv-mine-sheet .mine-turn-detail .kv-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .cv-mine-sheet .mine-turn-detail .kv-row span { padding: 2px 7px; border-radius: 7px; background: rgba(120, 120, 128, 0.08); font-variant-numeric: tabular-nums; }
    .cv-mine-sheet .mine-turn-detail .kv-row span b { font-weight: 650; }

    /* ledger ------------------------------------------------------------- */
    .cv-mine-sheet .mine-blk {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 13px;
      background: #fff;
      border: 0.5px solid var(--separator);
      border-left: 3px solid var(--mine-agent);
      scroll-margin-top: 44px;
    }
    .cv-mine-sheet .mine-blk.axis-user { border-left-color: var(--mine-user); }
    .cv-mine-sheet .mine-blk-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .cv-mine-sheet .mine-blk-h h3 { flex: 1; font-size: 13px; font-weight: 650; margin: 0; }
    .cv-mine-sheet .mine-blk.axis-user .mine-blk-h h3 { color: var(--mine-user); }
    .cv-mine-sheet .mine-blk.axis-agent .mine-blk-h h3 { color: var(--mine-agent); }
    .cv-mine-sheet .mine-blk-h .axis { font-size: 10.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .cv-mine-sheet .mine-blk .note { font-size: 12px; color: var(--muted); margin: 0 0 8px; line-height: 1.45; }
    .cv-mine-sheet .mine-cap { font-size: 11.5px; font-weight: 650; color: var(--muted); margin: 10px 0 4px; }
    .cv-mine-sheet table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }
    .cv-mine-sheet th, .cv-mine-sheet td {
      text-align: left;
      padding: 5px 6px;
      border-bottom: 0.5px solid var(--separator);
      vertical-align: top;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .cv-mine-sheet th { font-size: 11px; color: var(--muted); font-weight: 650; }
    .cv-mine-sheet tbody tr:hover { background: rgba(120, 120, 128, 0.06); }
    .cv-mine-sheet td.path, .cv-mine-sheet td.repo, .cv-mine-sheet td.tool,
    .cv-mine-sheet td.mcp, .cv-mine-sheet td.doc, .cv-mine-sheet td.prompt,
    .cv-mine-sheet td.cmd, .cv-mine-sheet td.family {
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .cv-mine-sheet .mine-copy,
    .cv-mine-sheet .mine-x {
      height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      border: 0.5px solid rgba(60, 60, 67, 0.22);
      background: #fff;
      font: 600 12px/27px inherit;
      cursor: pointer;
    }
    .cv-mine-sheet .mine-copy:hover, .cv-mine-sheet .mine-x:hover { background: rgba(120, 120, 128, 0.10); }
    .cv-mine-sheet .mine-empty { color: var(--muted); font-size: 13px; }
    .cv-mine-fab.is-on {
      color: var(--honey);
      border-color: var(--honey);
    }
    .cv-mine-sheet.is-updating .mine-scroll::before,
    .cv-mine-sheet.is-pending .mine-scroll::before {
      content: "有新事件 · 更新中…";
      position: sticky;
      top: 0;
      display: block;
      margin: 0 0 8px;
      padding: 3px 9px;
      width: max-content;
      border-radius: 980px;
      background: var(--honey-soft);
      color: var(--honey);
      font-size: 11.5px;
      font-weight: 600;
    }
    .cv-mine-sheet.is-pending .mine-scroll::before { content: "有新事件 · 关掉回合明细后更新"; }
    .cv-mine-sheet .mine-sec.is-hit,
    .cv-mine-sheet .mine-blk.is-hit {
      outline: 2px solid var(--mine-agent);
      outline-offset: 2px;
      transition: outline-color 0.6s ease;
    }
    .cv-mine-sheet td.num {
      position: relative;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .cv-mine-sheet td.num .mine-bar {
      position: absolute;
      left: 0;
      top: 3px;
      bottom: 3px;
      width: var(--v, 0%);
      border-radius: 4px;
      background: rgba(196, 122, 44, 0.16);
      z-index: 0;
    }
    .cv-mine-sheet td.num > span { position: relative; z-index: 1; }
    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(132px, 30vh) minmax(0, 1fr);
      }
      .rail { border-right: 0; border-bottom: 0.5px solid var(--separator); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card:active, .copy-id:active, .pin-btn:active, .follow:active { transform: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>会话</h1>
      <div class="sub" id="health">加载中…</div>
    </div>
    <div class="grow"></div>
    <a class="back" href="http://127.0.0.1:8080/">回剪贴板</a>
  </header>
  <div class="app">
    <aside class="rail">
      <div class="rail-search"><input type="search" id="q" placeholder="搜 prompt / 工具" /></div>
      <div id="sessionList"><div class="empty">暂无会话</div></div>
    </aside>
    <section class="stage">
      <div class="session-head is-empty" id="sessionHead">
        <span class="sid" id="sessionSid"></span>
        <span class="idline">
          <span id="sessionWhen"></span>
          <span id="sessionSource"></span>
          <span id="sessionHost"></span>
          <span class="cwd" id="sessionCwd"></span>
        </span>
      </div>
      <div class="thread" id="thread"><div class="empty">选择左侧会话</div></div>
      <button type="button" class="follow" id="jumpBot" hidden title="回到最新" aria-label="回到最新并跟踪">↓</button>
    </section>
  </div>
  <script type="module">
    import {
      asObj, askAnswers, askQuestions, blocksFromEvent, bundleTitle, focusImRows,
      imMessagesFromEvents, isAskTool, layoutKey, localDateTime, localDayKey, prettyJson,
      recencyTone, relLocalTime, renderEventBlocks, renderValue, rowPreview, volumeBand,
    } from "./session-render.mjs";
    import {
      canFetch, canIngest, createLoadState, readSnap, reduce, writeSnap,
    } from "./session-load.mjs";

      y.setDate(y.getDate() - 1);
      if (key === today) return "今天";

    };
    const relTime = relLocalTime;
    const sessionTitle = (s) => {

    const bindSessionCard = (el) => {

    const makeSessionCard = (s) => {

    const patchSessionList = (sessions) => {

    async function toggleSessionPin(sid, pinned) {
      try {

    const toolBits = (e) => {
      const resp = asObj(e.tool_response) || {};
      const bits = [];
      if (resp.exit_code != null) bits.push("exit " + resp.exit_code);
      if (resp.status) bits.push(String(resp.status));
      if (resp.wall_time_seconds != null) bits.push(resp.wall_time_seconds + "s");
      return bits.join(" · ");
    };
    const bulky = (text) => {
      const s = String(text || "");
      return s.length > 900 || s.split(/\n/).length > 14;
    };
    const renderTool = (e) => {
      const tools = [e.tool_name, e.llm_tool_name].filter(Boolean).join(" / ");
      const name = tools || "工具";
      const result = toolBits(e);
      const meta = [localDateTime(e.ts), tools].filter(Boolean).join(" · ");
      let html = `<div class="tool-head"><span class="tool-name">${esc(name)}</span><span class="tool-result">${esc(result)}</span></div>`;
      for (const b of blocksFromEvent(e)) {
        if (b.key === "result") continue;
        const rendered = meterMd(renderValue(b.text, b.hint, engines()), b.text);
        if (b.key === "command" || b.key === "tool_input") {
          html += `<div class="tool-cmd">${rendered.html}</div>`;
          continue;
        }
        if (b.key === "output") {
          if (bulky(b.text)) {
            const preview = String(b.text).trim().split(/\n/).slice(0, 3).join("\n");
            const n = String(b.text).split(/\n/).length;
            html += `<div class="tool-preview"><pre>${esc(preview)}</pre></div>
              <details class="tool-fold"><summary>展开输出 · ${n} 行</summary>

          } else {
            html += `<div class="tool-out">${rendered.html}</div>`;

          continue;

        html += `<div class="kv"><div class="k">${esc(b.key)}</div>${rendered.html}</div>`;
      }
      html += `<div class="meta">${esc(meta)}</div>
        <details class="raw">
          <summary>原始 JSON</summary>
          <div class="raw-body">加载中…</div>
        </details>`;
      return html;

    function renderRows(rows, prev) {
      let lastDay = prev ? dayKey(prev.event.ts) : "";
      let lastRole = prev ? prev.role : "";
      return rows.map((row) => {
        const e = row.event;
        const day = dayKey(e.ts);
        const grouped = lastRole === row.role && row.role !== "system" && day === lastDay;
        const chip = day && day !== lastDay
          ? `<div class="day"><span>${esc(dayLabel(day))}</span></div>`
          : "";
        lastDay = day;
        lastRole = row.role;
        const tools = [e.tool_name, e.llm_tool_name].filter(Boolean).join(" / ");
        const meta = [localDateTime(e.ts), tools].filter(Boolean).join(" · ");
        const body = row.role === "tool" ? "" : renderEventBlocks(e, engines()).map((b) => {
          meterMd(b, "");
          return `<div class="kv">${(b.key === "result" || b.key === "prompt") ? "" : `<div class="k">${esc(b.key)}</div>`}${b.html}</div>`;
        }).join("");
        const who = grouped ? "" : `<div class="who">${esc(row.label)}</div>`;
        let inner;
        if (row.role === "tool") {
          inner = renderTool(e);
        } else if (row.role === "ask" || (row.role === "user" && isAskTool(e))) {
          inner = `${who}<div class="bubble-body">${renderAskBody(e)}</div>
            <div class="meta">${esc(meta)}</div>`;
        } else if (row.role === "system") {
          inner = `<div class="bubble-body">${esc(e.notification_message || e.hook_event || "")}</div>
            <div class="meta">${esc(localDateTime(e.ts))}</div>`;
        } else {
          inner = `${who}<div class="bubble-body">${body}</div>
            <div class="meta">${esc(meta)}</div>
            <details class="raw">
              <summary>原始 JSON</summary>
              <div class="raw-body">加载中…</div>
            </details>`;
        }
        return `${chip}<div class="row ${esc(row.role)}${grouped ? " grouped" : ""}">
          <article class="bubble ${esc(row.role)}" data-id="${esc(e.event_id)}">${inner}</article>
        </div>`;
      }).join("");
    }

    function renderAskBody(e) {
      const qs = askQuestions(e);
      const ans = askAnswers(e);
      if (qs.length) {
        return qs.map((q, i) => {
          const head = esc(q.header || q.question || "问题");
          const picked = ans[i]?.selected_options || [];
          const opts = (q.options || []).map((o) => {
            const on = picked.includes(o.label);
            return `<div class="ask-opt${on ? " is-on" : ""}">${esc(o.label || "")}</div>`;
          }).join("");
          return `<div class="ask-q"><div class="ask-h">${head}</div>${opts}</div>`;
        }).join("");

      return esc(e.notification_message || e.hook_event || "需要你");
    }

    function reconcile(parent, nextEls) {
      let cursor = parent.firstChild;
      for (const el of nextEls) {
        if (!el) continue;
        if (el === cursor) {
          cursor = cursor.nextSibling;
          continue;
        }
        parent.insertBefore(el, cursor);
      }
      while (cursor) {
        const dead = cursor;
        cursor = cursor.nextSibling;
        dead.remove();
      }
    }

    function bindHistoryItem(el) {

          pack.querySelectorAll(":scope > details.history-item").forEach((d) => {
            if (d !== el) d.open = false;
          });

        const body = el.querySelector(".history-item-body");

        if (body.dataset.loaded) return;
        let row = liveById(el.dataset.eid);
        const slim = row && row.role === "tool"
          && row.event && row.event.tool_input == null && row.event.tool_response == null;
        if (!row || slim) {
          try {
            const d = await (await fetch(apiUrl("/api/event?id=" + encodeURIComponent(el.dataset.eid)))).json();
            if (d.event && d.event.event_id) {
              const i = liveEvents.findIndex((x) => x.event_id === d.event.event_id);
              if (i >= 0) liveEvents[i] = d.event;
              else {
                liveEvents.push(d.event);
                liveIds.add(d.event.event_id);
              }
              row = imMessagesFromEvents([d.event])[0];
            }
          } catch (err) {
            body.textContent = String(err);

          }
        }
        if (!row) {
          body.innerHTML = '<div class="empty">这条还不在当前窗口，请点「查看全部」或刷新</div>';
          return;
        }
        body.innerHTML = renderRows([row], { event: row.event, role: "__" });
        body.dataset.loaded = "1";
        bindRaws(body);
      });

    function makeHistoryItem(row) {

    function liveById(id) {

    function updateBundleEl(wrap, item) {
      const pack = wrap.querySelector("details.history-bundle");
      if (!pack) return;
      const summary = pack.querySelector(":scope > summary");
      const title = item.title || bundleTitle(item.rows);
      if (summary && summary.textContent !== title) summary.textContent = title;

      const all = item.rows || [];
      wrap._bundleRows = all;
      if (!pack.open && body.dataset.expandAll !== "1") {
        reconcile(body, [btn]);
        bindBundleExpand(wrap);
        if (!pack.dataset.toggleBound) {
          pack.dataset.toggleBound = "1";
          pack.addEventListener("toggle", () => {
            if (pack.open) updateBundleEl(wrap, { rows: wrap._bundleRows, title });
          });
        }
        return;
      }
      const rows = body.dataset.expandAll === "1" || all.length <= BUNDLE_SHOW
        ? all
        : all.slice(-BUNDLE_SHOW);
      const items = rows.map((row) => {
        const eid = String(row.event.event_id || "");

    function bindBundleExpand(root) {

    async function loadHealth() {

    async function loadSessions() {
      if (!canFetch(load)) {
        emit("trae_sessions_skip", {
          ok: false,
          payload: { reason: load.paused ? "paused" : "nofetch", kind: "list", n: sessionRows.length, phase: load.phase },
        });
        return { sessions: sessionRows, switched: false };
      }
      const box = $("sessionList");
      let switched = false;
      try {
        const data = await netJson("list", apiUrl("/api/sessions?limit=80"));
        const sessions = data.sessions || [];
        sessionRows = sessions;
        if (!sessions.length) {
          lastListSig = "";
          box.innerHTML = '<div class="empty">还没有 hook 事件。装好 hooks 后硬重启 Trae，再发一条真实消息。</div>';
          return { sessions, switched };
        }
        const listSig = sessions.map((s) =>
          `${s.session_id}:${s.event_count}:${s.last_ts}:${s.pinned_at || ""}:${s.instance_id || ""}:${s.cwd || ""}:${recencyTone(s.last_ts)}:${volumeBand(s.event_count)}`
        ).join("|");
        const latest = newestSession(sessions);
        const takeLatest = latest && latest.session_id && (!current || (followLatest && latest.session_id !== current));
        if (takeLatest) {
          current = latest.session_id;
          lastSig = "";
          painted = "";
          liveEvents = [];
          liveIds.clear();
          markFollow(true);
          showSessionHead(current, sessionTitle(latest), latest);
          switched = true;
          if (mineState.open) loadMine();
        }
        emit("trae_sessions_list", { payload: { n: sessions.length } });
        if (listSig === lastListSig) return { sessions, switched };
        lastListSig = listSig;
        railY = box.scrollTop;
        patchSessionList(sessions);
        box.scrollTop = railY;
        if (current) {
          const row = sessions.find((s) => s.session_id === current);
          if (row) showSessionHead(current, sessionTitle(row), row);
        }
        return { sessions, switched };
      } catch (err) {
        emit("trae_sessions_error", { payload: { reason: "list" } });
        box.innerHTML = `<div class="empty">加载会话列表失败${err && err.message ? " · " + esc(err.message) : ""}</div>`;
        return { sessions: [], switched };
      }
    }
    function paintFromLive(kind) {
      try {
        resetMdMeter();
        const gate = paintGateReason();
        if (gate) {
          emitLayout(kind || "paint");
          emit("trae_sessions_skip", { ok: false, payload: { reason: gate, kind: String(kind || "paint").slice(0, 32), n: liveEvents.length } });
          return;
        }
        if (!current) {
          emit("trae_sessions_skip", { payload: { reason: "nocurrent", kind: String(kind || "paint").slice(0, 32) } });
          if (!thread.querySelector(":scope > .thread-block, :scope > [data-key]")) {
            thread.innerHTML = '<div class="empty">选择左侧会话</div>';
          }
          showSessionHead("");
          liveEvents = [];
          liveIds.clear();
          lastSig = "";
          return;
        }
        if (!liveEvents.length) {
          emit("trae_sessions_skip", { payload: { reason: "empty", kind: String(kind || "paint").slice(0, 32) } });
          if (!thread.querySelector(":scope > .thread-block, :scope > [data-key]")) {
            thread.innerHTML = '<div class="empty">没有匹配事件</div>';
          }
          lastSig = "";
          return;
        }
        const rows = imMessagesFromEvents(liveEvents);
        const items = focusImRows(rows);
        const bundles = items.filter((it) => it.type === "bundle").length;
        const sig = rows.map((r) => r.event.event_id).join(",");
        if (sig === lastSig && kind !== "full" && kind !== "settle") return;
        if (sig === lastSig) {
          painted = current;
          emitLayout(kind || "paint");
          return;
        }
        const grew = lastSig && sig.startsWith(lastSig + ",");
        const t0 = performance.now();
        if (kind === "patch" && grew && thread.querySelector(":scope > .thread-block")) {
          const prevIds = new Set(lastSig.split(",").filter(Boolean));
          const added = rows.filter((r) => r && r.event && r.event.event_id && !prevIds.has(r.event.event_id));
          const end = threadEndEl();
          for (const row of added) {
            const el = makeFocusEl({ type: "focus", row }, null);
            thread.insertBefore(el, end);
          }
          lastSig = sig;
          emit("trae_sessions_paint", {
            dur_ms: performance.now() - t0,
            payload: {
              n: added.length,
              kind: "append",
              chars: liveEvents.length,
              bytes: thread.childElementCount,
              nodes: thread.querySelectorAll("*").length,
              value: bundles,
            },
          });
          emitMdMeter("append");
          emitLayout(kind || "paint");
          markTtfp(kind);
          painted = current;
          return;
        }
        lastSig = sig;
        thread.querySelectorAll(":scope > .empty").forEach((n) => n.remove());
        patchThread(items);
        if (painted !== current) pinBottom();
        emit("trae_sessions_paint", {
          dur_ms: performance.now() - t0,
          payload: {
            n: items.length,
            kind: String(kind || "full").slice(0, 32),
            chars: liveEvents.length,
            bytes: thread.childElementCount,
            nodes: thread.querySelectorAll("*").length,
            value: bundles,
          },
        });
        emitMdMeter(kind || "full");
        emitLayout(kind || "paint");
        markTtfp(kind);
        if (!(followTail || painted !== current) && grew) {
          pendingNew = true;
          syncFollowBtn();
        }
        painted = current;
      } catch (err) {
        emit("trae_sessions_error", { ok: false, payload: { reason: "paint" } });
        thread.innerHTML = `<div class="empty">渲染对话失败${err && err.message ? " · " + esc(err.message) : ""}</div>`;
      }
    }

    async function hydrateSlimTools() {
      const t0 = performance.now();
      const gen = eventsGen;
      const items = focusImRows(imMessagesFromEvents(liveEvents));
      const ids = [];
      for (const item of items) {
        if (item.type !== "focus") continue;
        const row = item.row;
        const e = row && row.event;
        if (!e || row.role !== "tool") continue;
        if (e.tool_input != null || e.tool_response != null) continue;
        if (e.event_id) ids.push(e.event_id);
      }
      if (!ids.length) return;
      let n = 0;
      const loadOne = async (id) => {
        if (gen !== eventsGen) return;
        try {
          const d = await (await fetch(apiUrl("/api/event?id=" + encodeURIComponent(id)))).json();
          const ev = d.event;
          if (!ev || !ev.event_id) return;
          const i = liveEvents.findIndex((x) => x.event_id === ev.event_id);
          if (i >= 0) liveEvents[i] = ev;
          n += 1;
        } catch (_) {}
      };
      const pool = 4;
      for (let i = 0; i < ids.length; i += pool) {
        if (gen !== eventsGen) return;
        await Promise.all(ids.slice(i, i + pool).map(loadOne));
      }
      if (n && gen === eventsGen) paintFromLive("patch");
      if (gen === eventsGen && ids.length) {
        emit("trae_sessions_tools", { dur_ms: performance.now() - t0, ok: n === ids.length, payload: { n: ids.length, kind: "slim" } });
      }
    }

    async function loadEvents(view, opts) {
      const paint = !opts || opts.paint !== false;
      if (!canFetch(load)) {
        emit("trae_sessions_skip", {
          ok: false,
          payload: { reason: load.paused ? "paused" : "nofetch", kind: String(view || "full").slice(0, 32), n: liveEvents.length, phase: load.phase },
        });
        return;
      }
      const gen = ++eventsGen;
      const sid = current;
      const kind = view === "tools" ? "tools" : view === "beats" ? "beats" : "full";
      if (eventsAbort && kind !== "tools") {
        try { eventsAbort.abort(); } catch (_) {}
      }
      const ac = new AbortController();
      if (kind !== "tools") eventsAbort = ac;
      const q = (document.getElementById("q") || {}).value || "";
      const params = new URLSearchParams();
      // Tool index is the whole timeline. limit=200 here is CLIENT_CAP:
      // historical turns keep Stop conclusions and drop every Pre/PostToolUse.
      if (kind !== "tools") params.set("limit", "200");
      if (sid) params.set("session_id", sid);
      if (String(q).trim()) params.set("q", String(q).trim());
      else if (kind === "beats" || kind === "tools") params.set("view", kind);
      if (!sid) {
        paintFromLive("full");
        return;
      }
      if (!liveEvents.length && kind !== "tools") {
        if (!thread.querySelector(":scope > .thread-block, :scope > [data-key]")) {
          thread.innerHTML = '<div class="empty">加载对话…</div>';
        }
      }
      emit("trae_sessions_load", { payload: { kind, phase: "start" } });
      try {
        const data = await netJson(kind, apiUrl("/api/events?" + params), { signal: ac.signal });
        if (gen !== eventsGen || current !== sid) return;
        mergeIncoming(data.events || []);
        if (paint) paintFromLive(kind);
        emit("trae_sessions_load", { payload: { n: liveEvents.length, kind, phase: "end" } });
        return data;
        if (kind !== "tools") dispatch({ type: "resync_ok" });
      } catch (err) {
        if (err && err.name === "AbortError") return;
        if (gen !== eventsGen) return;
        emit("trae_sessions_error", { payload: { reason: "events" } });
        dispatch({ type: "resync_fail", reason: "events" });
        if (!liveEvents.length) {
          lastSig = "";
          thread.innerHTML = `<div class="empty">加载对话失败${err && err.message ? " · " + esc(err.message) : ""}</div>`;
        }
      }
    }

    function hookIsBeat(meta) {
      const h = String((meta && meta.hook_event) || "");
      const tool = String((meta && meta.tool_name) || "");
      return h === "UserPromptSubmit" || h === "Stop" || h === "Notification"
        || tool === "AskUserQuestion";
    }
    async function ingestHookIds(ids) {
      const uniq = [...new Set(ids.filter(Boolean))];
      if (!uniq.length || !current || !canIngest(load)) return;
      const batch = uniq.length > 16 ? uniq.slice(-16) : uniq;
      if (uniq.length > 16) {
        emit("trae_sessions_load", { payload: { n: uniq.length, kind: "patch", reason: "overflow" } });
      }
      let added = 0;
      for (const id of batch) {
        if (liveIds.has(id)) continue;
        const meta = pendingHookMeta.get(id) || {};
        if (meta.session_id && current && meta.session_id !== current) continue;
        liveIds.add(id);
        liveEvents.push({
          event_id: id,
          ts: meta.ts || "",
          session_id: meta.session_id || current,
          hook_event: meta.hook_event || "PostToolUse",
          tool_name: meta.tool_name || "",
          prompt: meta.preview || "",
          notification_message: meta.notification_message || "",
          notification_type: meta.notification_type || "",
        });
        added += 1;
      }
      if (added) paintFromLive("patch");
    }

    async function loadThreadPair() {
      await loadEvents("beats", { paint: false });
      if (canFetch(load)) await loadEvents("tools", { paint: false });
      if (current && liveEvents.length) paintFromLive("pair");
      else if (current) paintFromLive("beats");
      if (canFetch(load)) await hydrateSlimTools();
      if (canFetch(load)) dispatch({ type: "resync_ok" });
    }
    $("q").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") loadThreadPair();
    });
    jumpBot.addEventListener("click", () => {
      markFollow(true);
      pinBottomSoon();
    });
    const scheduleList = () => {
      if (!canFetch(load) || listTimer) return;
      listTimer = setTimeout(async () => {
        listTimer = 0;
        if (!canFetch(load)) return;
        await loadHealth();
        const r = await loadSessions();
        if ((r && r.switched) || (current && !liveEvents.length)) {
          await loadThreadPair();
        }
      }, 1000);
    };
    const runResync = async () => {
      if (!canFetch(load)) {
        emit("trae_sessions_skip", {
          ok: false,
          payload: { reason: load.paused ? "paused" : "nofetch", kind: "resync", phase: load.phase },
        });
        return;
      }
      dispatch({ type: "resync_start" });
      try {
        loadHealth();
        await loadSessions();
        if (current) {
          await loadThreadPair();
        } else dispatch({ type: "resync_ok" });
      } catch (err) {
        emit("trae_sessions_error", { payload: { reason: "resync" } });
        dispatch({ type: "resync_fail", reason: "resync" });
      }
    };
    const scheduleResync = () => {
      if (!canFetch(load) || resyncTimer) return;
      resyncTimer = setTimeout(async () => {
        resyncTimer = 0;
        await runResync();
      }, 0);
    };
    const scheduleHookPaint = () => {
      if (!canIngest(load) || hookPaintTimer) return;
      hookPaintTimer = setTimeout(() => {
        hookPaintTimer = 0;
        scheduleList();
        // The analysis sheet fully covers the thread; keep it quiet behind the
        // sheet and flush the queued hooks when the sheet closes.
        if (mineState.open) return;
        const ids = pendingHookIds;
        pendingHookIds = [];
        ingestHookIds(ids);
      }, 40);
    };
    const setupSSE = () => {
      if (!canFetch(load)) return;
      if (es && es.readyState !== EventSource.CLOSED) return;
      try { if (es) es.close(); } catch (_) {}
      es = new EventSource(apiUrl("/api/stream"));
      es.onopen = () => dispatch({ type: "stream_open" });
      es.onmessage = (ev) => {
        let d;
        try { d = JSON.parse(ev.data); } catch (_) { return; }
        if (!d || d.type === "ping" || d.type === "connected") return;
        if (d.type === "resync_required") {
          emit("trae_sessions_resync", { payload: { reason: "overflow" } });
          lastSig = "";
          lastListSig = "";
          dispatch({ type: "overflow" });
          return;
        }
        if (d.type === "session_pinned") {
          lastListSig = "";
          loadSessions();
          return;
        }
        if (d.type === "hook_event") {
          if (!canIngest(load)) return;
          emit("trae_sessions_hook", { payload: { n: 1 } });
          if (d.event_id) {
            pendingHookIds.push(d.event_id);
            pendingHookMeta.set(d.event_id, d);
          }
          if (followLatest && d.session_id && d.session_id !== current) {
            current = d.session_id;
            lastSig = "";
            painted = "";
            pendingHookIds = [];
            markFollow(true);
            dispatch({ type: "overflow" });
            scheduleMineRefresh();
            return;
          }
          scheduleHookPaint();
          scheduleMineRefresh();
        }
      };
    };
    window.addEventListener("message", (ev) => {
      const t = ev && ev.data && ev.data.type;
      if (t === "clipvault-sessions-pause") dispatch({ type: "pause", reason: "parent" });
      if (t === "clipvault-sessions-resume") {
        dispatch({ type: "resume", reason: "parent" });
        notifyOverlay();
      }
      if (t === "clipvault-sessions-settled") {
        layoutReady = true;
        emitLayout("settled");
        if (thread.querySelector(":scope > [data-key]")) {
          markTtfp("settle");
        } else if (canFetch(load)) {
          scheduleResync();
        } else if (current && liveEvents.length) {
          try { paintFromLive("settle"); markTtfp("settle"); } catch (_) {}
        }
      }
    });
    if (typeof ResizeObserver !== "undefined") {
      try {
        let layoutTick = 0;
        const ro = new ResizeObserver(() => {
          if (layoutTick) return;
          layoutTick = window.setTimeout(() => {
            layoutTick = 0;
            emitLayout("resize");
            if (layoutReady && current && liveEvents.length && !thread.querySelector(":scope > [data-key]")) {
              try { paintFromLive("resize"); } catch (_) {}
            }
          }, 120);
        });
        const app = document.querySelector(".app");
        if (app) ro.observe(app);
        if (thread) ro.observe(thread);
      } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !load.paused) dispatch({ type: "resume" });
    });
    window.addEventListener("pageshow", () => {
      if (!load.paused) dispatch({ type: "resume" });
    });
    window.addEventListener("online", () => {
      if (!load.paused) dispatch({ type: "resume" });
    });
    markFollow(true);
    emit("trae_sessions_boot", { payload: { phase: "start" } });
    emitLayout("boot");
    dispatch({ type: "boot" });
  </script>
</body>
</html>
