<body>
  <header class="top">

      <h1>会话</h1>

    </section>
  </div>
  <script type="module">
    import {
      asObj, askAnswers, askQuestions, blocksFromEvent, bundleTitle, focusImRows,
      imMessagesFromEvents, isAskTool, layoutKey, localDateTime, localDayKey, prettyJson,

    } from "./session-render.mjs";
    import {
      canFetch, canIngest, createLoadState, readSnap, reduce, writeSnap,
    } from "./session-load.mjs";

    const TRAE_BASE = location.pathname.startsWith("/trae") ? "/trae" : "";
    const apiUrl = (p) => TRAE_BASE + p;
    if (window.parent !== window || /(?:^|[?&])embed(?:[=&]|$)/.test(location.search)) {
      document.documentElement.classList.add("embed");
    }

    const $ = (id) => document.getElementById(id);
    const thread = $("thread");
    const jumpBot = $("jumpBot");
    let current = "";
    let painted = "";
    let followTail = true;
    let followLatest = true;
    let pendingNew = false;
    let lastSig = "";
    let lastListSig = "";
    let sessionRows = [];
    let liveEvents = [];
    const liveIds = new Set();
    let pendingHookIds = [];
    const pendingHookMeta = new Map();
    let railY = 0;
    let es = null;
    let load = createLoadState();
    const bootAt = performance.now();
    let ttfpSent = false;
    let eventsGen = 0;
    let eventsAbort = null;
    let resyncTimer = 0;
    let listTimer = 0;
    let hookPaintTimer = 0;
    const BUNDLE_SHOW = 32;
    const NEAR = 64;
    const METRICS = "http://127.0.0.1:8080/api/ui-metrics";
    const metricQ = [];
    let metricFlush = 0;
    function newTrace() {
      try { if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "").slice(0, 16); } catch (_) {}
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
    }
    let sessTrace = newTrace();
    const emit = (name, extra) => {
      if (!/^[a-z][a-z0-9_]{1,63}$/.test(name)) return;
      const ev = { name, ts: Date.now() };
      if (extra && extra.dur_ms != null && Number.isFinite(extra.dur_ms)) ev.dur_ms = extra.dur_ms;
      if (extra && extra.value != null && Number.isFinite(extra.value)) ev.value = extra.value;
      if (extra && typeof extra.ok === "boolean") ev.ok = extra.ok;
      if (extra && typeof extra.over === "boolean") ev.over = extra.over;
      if (extra && extra.trace) ev.trace = String(extra.trace).slice(0, 64);
      else if (sessTrace) ev.trace = sessTrace;
      if (extra && extra.payload && typeof extra.payload === "object") {
        const p = {};
        for (const [k, v] of Object.entries(extra.payload)) {
          if (!/^(mode|ratio|chars|bytes|n|value|interaction|q_len|kind|phase|reason|lag|host|w|h|nodes|compiled|reused)$/.test(k)) continue;
          if (typeof v === "number" && Number.isFinite(v)) p[k] = v;
          else if (typeof v === "string" && v.length <= 32) p[k] = v;
        }
        if (Object.keys(p).length) ev.payload = p;
      }
      metricQ.push(ev);
      sessRing.push(ev);
      if (sessRing.length > 80) sessRing.splice(0, sessRing.length - 80);
      sessMetricsCtl?.noteIncoming?.();
      // Debounced batch instead of one POST per trae_ event.
      if (metricQ.length >= 60) flushMetrics();
      else if (!metricFlush) metricFlush = window.setTimeout(flushMetrics, 400);
    };
    const sessRing = [];
    const cornerMount = document.querySelector(".stage") || document.querySelector(".app") || document.body;
    const corner = document.createElement("div");
    corner.className = "cv-corner-stack";
    cornerMount.appendChild(corner);
    const sessMetricsCtl = globalThis.ClipMetricsPanel && ClipMetricsPanel.create
      ? ClipMetricsPanel.create({
          family: "sessions",
          mount: corner,
          getLocal: () => sessRing.slice(),
        })
      : null;
    const MINE_KEY = "cv.trae.mine.v1";
    const mineState = { open: false, scope: "session", dirs: [], loading: false };
    try {
      const saved = JSON.parse(localStorage.getItem(MINE_KEY) || "null");
      if (saved && typeof saved === "object") {
        if (saved.scope === "recent" || saved.scope === "session") mineState.scope = saved.scope;
        if (Array.isArray(saved.dirs)) mineState.dirs = saved.dirs.filter((d) => typeof d === "string");
      }
    } catch (_) {}
    const mineHost = document.createElement("div");
    mineHost.className = "cv-mine-float";
    mineHost.innerHTML = `<button type="button" class="cv-debug-fab cv-mine-fab" id="mineOpen" aria-label="分析" aria-pressed="false">分析</button>`;
    corner.insertBefore(mineHost, corner.firstChild);
    const jump = $("jumpBot");
    if (jump) corner.appendChild(jump);
    const mineSheet = document.createElement("div");
    mineSheet.className = "cv-mine-sheet";
    mineSheet.hidden = true;
    mineSheet.innerHTML = `<div class="mine-head">
        <div class="mine-head-row">
          <h2>会话分析</h2>
          <button type="button" class="mine-copy" id="mineCopy">复制 AGENTS 草稿</button>
          <button type="button" class="mine-x" id="mineClose" aria-label="关闭">关闭</button>
        </div>
        <p class="mine-sum" id="mineSum"></p>
        <div class="mine-scopes">
          <button type="button" class="mine-chip" data-scope="session">当前会话</button>
          <button type="button" class="mine-chip" data-scope="recent">最近 7 天</button>
        </div>
        <div class="mine-dirs" id="mineDirs"></div>
      </div>
      <div class="mine-scroll" id="mineBody"><p class="mine-empty">打开后按工作目录、Git 库、工具、MCP 与阶段挖资产。</p></div>`;
    cornerMount.appendChild(mineSheet);
    const mineBody = mineSheet.querySelector("#mineBody");
    const mineDirsEl = mineSheet.querySelector("#mineDirs");
    let mineLast = null;
    const persistMine = () => {
      try { localStorage.setItem(MINE_KEY, JSON.stringify({ scope: mineState.scope, dirs: mineState.dirs })); } catch (_) {}
    };
    const escMine = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const paintMineChips = (directions) => {
      const dirs = directions || (mineLast && mineLast.directions) || [];
      mineDirsEl.innerHTML = dirs.map((d) => {
        const on = !mineState.dirs.length || mineState.dirs.includes(d.id);
        return `<button type="button" class="mine-chip${on ? " is-on" : ""}" data-dir="${escMine(d.id)}">${escMine(d.title)}</button>`;
      }).join("");
      mineSheet.querySelectorAll("[data-scope]").forEach((b) => {
        b.classList.toggle("is-on", b.getAttribute("data-scope") === mineState.scope);
      });
    };
    const renderTable = (t) => {
      if (!t || !t.rows || !t.rows.length) return "";
      const cap = t.caption ? `<div class="mine-cap">${escMine(t.caption)}</div>` : "";
      const head = t.cols.map((c) => `<th>${escMine(c.title)}</th>`).join("");
      const body = t.rows.map((row) => `<tr>${t.cols.map((c) => `<td class="${escMine(c.id)}">${escMine(row[c.id] ?? "")}</td>`).join("")}</tr>`).join("");
      return `${cap}<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    };
    const renderMine = (data) => {
      mineLast = data;
      paintMineChips(data.directions);
      const sum = mineSheet.querySelector("#mineSum");
      const s = data && data.summary;
      if (sum) {
        sum.textContent = s
          ? `${s.n_turns || 0} 回合 · ${s.n_tools || 0} 工具 · 工作 ${s.work_s || 0}s · 等待 ${s.wait_s || 0}s · ${s.span || ""}`
          : "";
      }
      if (!data || !data.ok) {
        mineBody.innerHTML = `<p class="mine-empty">分析失败${data && data.error ? " · " + escMine(data.error) : ""}</p>`;
        return;
      }
      const fb = (data.feedback || []).map((f) => {
        const who = f.audience === "agent" ? "给 Agent / AGENTS.md" : "给用户 / prompt";
        return `<article class="mine-fb">
            <div class="who">${escMine(who)}</div>
            <div class="ttl">${escMine(f.title || "")}</div>
            <div>${escMine(f.text || "")}</div>
            ${f.evidence ? `<div class="ev">${escMine(f.evidence)}</div>` : ""}
            ${f.draft ? `<pre class="draft">${escMine(f.draft)}</pre>` : ""}
          </article>`;
      }).join("");
      const blocks = data.active
        ? data.active.map((id) => data.blocks && data.blocks[id]).filter(Boolean)
        : Object.values(data.blocks || {});
      const sections = blocks.map((b) => {
        const tables = (b.tables && b.tables.length ? b.tables : (b.table ? [b.table] : [])).map(renderTable).join("");
        if (!tables) return "";
        return `<section class="mine-block">
            <h3>${escMine(b.axis === "user" ? "用户 · " : "Agent · ")}${escMine(b.title)}</h3>
            ${b.note ? `<p class="note">${escMine(b.note)}</p>` : ""}
            ${tables}
          </section>`;
      }).join("");
      mineBody.innerHTML = (fb || "") + (sections || `<p class="mine-empty">${data.n_rows ? "这个方向没有信号" : "还没有足够事件"}</p>`);
    };
    const loadMine = async () => {
      if (!mineState.open || mineState.loading) return;
      mineState.loading = true;
      mineBody.innerHTML = '<p class="mine-empty">分析中…</p>';
      const params = new URLSearchParams({ scope: mineState.scope });
      if (mineState.scope === "session" && current) params.set("session_id", current);
      if (mineState.dirs.length) params.set("dirs", mineState.dirs.join(","));
      try {
        const data = await netJson("mine", apiUrl("/api/mine?" + params.toString()));
        if (mineState.open) renderMine(data);
      } catch (err) {
        if (mineState.open) mineBody.innerHTML = `<p class="mine-empty">分析失败${err && err.message ? " · " + escMine(err.message) : ""}</p>`;
      } finally {
        mineState.loading = false;
      }
    };
    const setMineOpen = (open) => {
      mineState.open = !!open;
      mineSheet.hidden = !mineState.open;
      mineHost.querySelector("#mineOpen").classList.toggle("is-on", mineState.open);
      mineHost.querySelector("#mineOpen").setAttribute("aria-pressed", mineState.open ? "true" : "false");
      if (mineState.open) {
        try { sessMetricsCtl?.setOpen?.(false); } catch (_) {}
        paintMineChips();
        loadMine();
      }
    };
    mineHost.querySelector("#mineOpen").addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      setMineOpen(!mineState.open);
    });
    mineSheet.querySelector("#mineClose").addEventListener("click", (ev) => {
      ev.preventDefault();
      setMineOpen(false);
    });
    mineSheet.addEventListener("click", (ev) => {
      const scopeBtn = ev.target.closest("[data-scope]");
      if (scopeBtn) {
        mineState.scope = scopeBtn.getAttribute("data-scope") || "session";
        persistMine();
        paintMineChips();
        loadMine();
        return;
      }
      const dirBtn = ev.target.closest("[data-dir]");
      if (dirBtn) {
        const id = dirBtn.getAttribute("data-dir");
        const dirs = mineState.dirs.length ? mineState.dirs.slice() : (mineLast && mineLast.directions || []).map((d) => d.id);
        const i = dirs.indexOf(id);
        if (i >= 0) dirs.splice(i, 1);
        else dirs.push(id);
        mineState.dirs = dirs;
        persistMine();
        paintMineChips();
        loadMine();
      }
    });
    mineSheet.querySelector("#mineCopy").addEventListener("click", async () => {
      const drafts = (mineLast && mineLast.feedback || []).map((f) => f.draft).filter(Boolean);
      const body = drafts.length
        ? drafts.join("\n")
        : (mineLast && mineLast.feedback || []).map((f) => `- ${f.text}`).join("\n");
      const md = "# 从会话分析得到的约束\n\n" + body + "\n";
      try {
        await navigator.clipboard.writeText(md);
        mineSheet.querySelector("#mineCopy").textContent = "已复制";
        setTimeout(() => { mineSheet.querySelector("#mineCopy").textContent = "复制 AGENTS 草稿"; }, 1200);
      } catch (_) {}
    });
    const mdMeter = { n: 0, chars: 0, dur: 0 };
    const resetMdMeter = () => { mdMeter.n = 0; mdMeter.chars = 0; mdMeter.dur = 0; };
    const meterMd = (rendered, text) => {
      if (rendered && rendered.kind === "markdown") {
        mdMeter.n += 1;
        mdMeter.chars += String(text || "").length;
        if (Number.isFinite(rendered.dur_ms)) mdMeter.dur += rendered.dur_ms;
      }
      return rendered;
    };
    const emitMdMeter = (kind) => {
      if (!mdMeter.n) return;
      emit("trae_sessions_md", {
        dur_ms: mdMeter.dur,
        payload: {
          n: mdMeter.n,
          chars: mdMeter.chars,
          kind: String(kind || "paint").slice(0, 32),
          phase: "markdown",
        },
      });
    };
    const rectSize = (el) => {
      if (!el || !el.getBoundingClientRect) return { w: 0, h: 0 };
      const r = el.getBoundingClientRect();
      return { w: Math.round(r.width), h: Math.round(r.height) };
    };
    const emitLayout = (phase) => {
      const app = document.querySelector(".app");
      const rail = document.querySelector(".rail");
      const a = rectSize(app);
      const r = rectSize(rail);
      const t = rectSize(thread);
      const stacked = a.w > 0 && r.w >= a.w - 8;
      const embed = document.documentElement.classList.contains("embed");
      emit("trae_sessions_layout", {
        payload: {
          phase: String(phase || "paint").slice(0, 32),
          kind: stacked ? "stack" : (embed ? "embed" : "page"),
          n: r.w,
          value: t.w,
          chars: a.w,
          bytes: a.h,
          w: r.w,
          h: t.h,
          nodes: thread ? thread.querySelectorAll("*").length : 0,
          ratio: a.w ? Math.round((r.w / a.w) * 100) / 100 : 0,
          reason: a.w < 280 ? "narrow" : (a.w < 800 ? "mid" : "wide"),
        },
      });
    };
    const layoutNarrow = () => {
      const app = document.querySelector(".app");
      return !app || app.getBoundingClientRect().width < 280;
    };
    let layoutReady = true;
    const paintGateReason = () => {
      if (layoutNarrow()) return "narrow";
      return "";
    };
    const sendBatch = (events) => {
      const body = JSON.stringify({ events, session: "trae-sessions" });
      const embedded = window.parent && window.parent !== window;
      try {
        if (embedded) {
          window.parent.postMessage({ type: "clipvault-ui-metrics", events, session: "trae-sessions" }, location.origin);
          return;
        }
      } catch (_) {}
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([body], { type: "application/json" });
          if (navigator.sendBeacon(METRICS, blob)) return;
        }
      } catch (_) {}
      fetch(METRICS, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body,
        keepalive: true,
      }).catch(() => {});
    };
    const flushMetrics = () => {
      metricFlush = 0;
      while (metricQ.length) sendBatch(metricQ.splice(0, 100));
    };
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") flushMetrics();
    });
    window.addEventListener("pagehide", flushMetrics);
    const dispatch = (ev) => {
      const { state, effects } = reduce(load, ev, Date.now());
      const prev = load.phase;
      load = state;
      if (load.phase !== prev) {
        const payload = { phase: load.phase };
        const why = ev && (ev.reason || ev.type);
        if (why) payload.reason = String(why).slice(0, 32);
        emit("trae_sessions_fsm", { payload });
      }
      for (const fx of effects) applyLoadEffect(fx);
    };
    const applySnap = (snap) => {
      if (!snap) return false;
      sessionRows = snap.sessions || [];
      current = snap.current || "";
      liveEvents = snap.events || [];
      liveIds.clear();
      for (const e of liveEvents) {
        if (e && e.event_id) liveIds.add(e.event_id);
      }
      if (sessionRows.length) {
        lastListSig = "";
        if (!current) {
          const latest = newestSession(sessionRows);
          if (latest && latest.session_id) current = latest.session_id;
        }
        try { patchSessionList(sessionRows); } catch (err) {
          emit("trae_sessions_error", { payload: { reason: "list" } });
        }
        emit("trae_sessions_list", { payload: { n: sessionRows.length, kind: "cache" } });
      }
      if (current) {
        const row = sessionRows.find((s) => s.session_id === current);
        showSessionHead(current, row ? sessionTitle(row) : current);
      }
      dispatch({ type: "cache_hit" });
      if (current && liveEvents.length) {
        requestAnimationFrame(() => {
          emitLayout("cache");
          // Snap is beats-only. Painting it here then merging tools shoves
          // thread-block layout (trae_sessions_cls). One paint in loadThreadPair.
        });
      }
      return true;
    };
    const saveSnap = () => {
      writeSnap(window.localStorage, {
        current,
        sessions: sessionRows,
        events: liveEvents.filter((e) => hookIsBeat(e)),
      });
    };
    const markTtfp = (kind) => {
      if (ttfpSent) return;
      ttfpSent = true;
      const lag = Math.round(performance.now() - bootAt);
      emit("trae_sessions_ttfp", { dur_ms: lag, payload: { kind: String(kind || "full").slice(0, 32), lag } });
    };
    const netJson = async (kind, url, opts) => {
      const t0 = performance.now();
      emit("trae_sessions_net", { payload: { kind, phase: "start" } });
      const res = await fetch(url, opts);
      const buf = await res.arrayBuffer();
      const bytes = buf.byteLength;
      const data = JSON.parse(new TextDecoder().decode(buf));
      const n = Array.isArray(data.events) ? data.events.length
        : Array.isArray(data.sessions) ? data.sessions.length
        : 1;
      emit("trae_sessions_net", { dur_ms: performance.now() - t0, payload: { kind, phase: "end", bytes, n } });

        btn.dataset.bound = "1";
        btn.addEventListener("click", async (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          const pack = btn.closest(".history-bundle");
          if (!pack) return;
          const host = pack.querySelector(".history-body");
          const wrap = pack.closest(".thread-block");
          if (host) host.dataset.expandAll = "1";
          if (wrap && wrap._bundleRows) {
            updateBundleEl(wrap, { rows: wrap._bundleRows, title: pack.querySelector(":scope > summary")?.textContent });
          }
          const items = [...pack.querySelectorAll("details.history-item")];
          for (const d of items) {
            d.open = true;
            await new Promise((r) => requestAnimationFrame(r));
          }
          if (host) delete host.dataset.expandAll;
        });
      });
    }

    function bindRaws(root) {
      root.querySelectorAll("details.raw").forEach((el) => {
        if (el.dataset.bound) return;
        el.dataset.bound = "1";
        el.addEventListener("toggle", async () => {
          if (!el.open) return;
          const host = el.querySelector(".raw-body");
          if (!host || host.dataset.loaded) return;
          const id = el.closest(".bubble").getAttribute("data-id");
          const t0 = performance.now();
          try {
            const d = await netJson("event", apiUrl("/api/event?id=" + encodeURIComponent(id)));
            const raw = d.event && d.event.raw_json ? d.event.raw_json : prettyJson(d.event);
            const text = String(raw || "");
            const cap = 12000;
            if (text.length > cap) {
              host.textContent = text.slice(0, cap) + "\n… truncated " + text.length + " chars";
            } else {
              host.innerHTML = renderValue(text, "json", engines()).html;
            }
            host.dataset.loaded = "1";
            emit("trae_sessions_paint", { dur_ms: performance.now() - t0, payload: { kind: "raw", n: text.length } });
          } catch (err) {
            emit("trae_sessions_error", { payload: { reason: "raw" } });
            host.textContent = String(err);
          }
        });
      });
    }

    async function loadHealth() {
      try {
        const h = await (await fetch(apiUrl("/api/health"))).json();
        $("health").textContent = `${h.events ?? 0} 条 · ${relTime(h.last_ts) || "—"}`;
      } catch (e) {
        $("health").textContent = "store 未就绪";
      }
    }
    async function loadSessions() {
      if (!canFetch(load)) {
        emit("trae_sessions_skip", {
          ok: false,
          payload: { reason: load.paused ? "paused" : "nofetch", kind: "list", n: sessionRows.length, phase: load.phase },
        });
        return { sessions: sessionRows, switched: false };
      }
      const box = $("sessionList");
      let switched = false;
      try {
        const data = await netJson("list", apiUrl("/api/sessions?limit=80"));
        const sessions = data.sessions || [];
        sessionRows = sessions;
        if (!sessions.length) {
          lastListSig = "";
          box.innerHTML = '<div class="empty">还没有 hook 事件。装好 hooks 后硬重启 Trae，再发一条真实消息。</div>';
          return { sessions, switched };
        }
        const listSig = sessions.map((s) =>
          `${s.session_id}:${s.event_count}:${s.last_ts}:${s.pinned_at || ""}:${s.instance_id || ""}:${s.cwd || ""}:${recencyTone(s.last_ts)}:${volumeBand(s.event_count)}`
        ).join("|");
        const latest = newestSession(sessions);
        const takeLatest = latest && latest.session_id && (!current || (followLatest && latest.session_id !== current));
        if (takeLatest) {
          current = latest.session_id;
          lastSig = "";
          painted = "";
          liveEvents = [];
          liveIds.clear();
          markFollow(true);
          showSessionHead(current, sessionTitle(latest), latest);
          switched = true;
          if (mineState.open) loadMine();
        }
        emit("trae_sessions_list", { payload: { n: sessions.length } });
        if (listSig === lastListSig) return { sessions, switched };
        lastListSig = listSig;
        railY = box.scrollTop;
        patchSessionList(sessions);
        box.scrollTop = railY;
        if (current) {
          const row = sessions.find((s) => s.session_id === current);
          if (row) showSessionHead(current, sessionTitle(row), row);
        }
        return { sessions, switched };
      } catch (err) {
        emit("trae_sessions_error", { payload: { reason: "list" } });
        box.innerHTML = `<div class="empty">加载会话列表失败${err && err.message ? " · " + esc(err.message) : ""}</div>`;
        return { sessions: [], switched };
      }
    }
    function paintFromLive(kind) {
      try {
        resetMdMeter();
        const gate = paintGateReason();
        if (gate) {
          emitLayout(kind || "paint");
          emit("trae_sessions_skip", { ok: false, payload: { reason: gate, kind: String(kind || "paint").slice(0, 32), n: liveEvents.length } });
          return;
        }
        if (!current) {
          emit("trae_sessions_skip", { payload: { reason: "nocurrent", kind: String(kind || "paint").slice(0, 32) } });
          if (!thread.querySelector(":scope > .thread-block, :scope > [data-key]")) {
            thread.innerHTML = '<div class="empty">选择左侧会话</div>';
          }
          showSessionHead("");
          liveEvents = [];
          liveIds.clear();
          lastSig = "";
          return;
        }
        if (!liveEvents.length) {
          emit("trae_sessions_skip", { payload: { reason: "empty", kind: String(kind || "paint").slice(0, 32) } });
          if (!thread.querySelector(":scope > .thread-block, :scope > [data-key]")) {
            thread.innerHTML = '<div class="empty">没有匹配事件</div>';
          }
          lastSig = "";
          return;
        }
        const rows = imMessagesFromEvents(liveEvents);
        const items = focusImRows(rows);
        const bundles = items.filter((it) => it.type === "bundle").length;
        const sig = rows.map((r) => r.event.event_id).join(",");
        if (sig === lastSig && kind !== "full" && kind !== "settle") return;
        if (sig === lastSig) {
          painted = current;
          emitLayout(kind || "paint");
          return;
        }
        const grew = lastSig && sig.startsWith(lastSig + ",");
        const t0 = performance.now();
        if (kind === "patch" && grew && thread.querySelector(":scope > .thread-block")) {
          const prevIds = new Set(lastSig.split(",").filter(Boolean));
          const added = rows.filter((r) => r && r.event && r.event.event_id && !prevIds.has(r.event.event_id));
          const end = threadEndEl();
          for (const row of added) {
            const el = makeFocusEl({ type: "focus", row }, null);
            thread.insertBefore(el, end);
          }
          lastSig = sig;
          emit("trae_sessions_paint", {
            dur_ms: performance.now() - t0,
            payload: {
              n: added.length,
              kind: "append",
              chars: liveEvents.length,
              bytes: thread.childElementCount,
              nodes: thread.querySelectorAll("*").length,
              value: bundles,
            },
          });
          emitMdMeter("append");
          emitLayout(kind || "paint");
          markTtfp(kind);
          painted = current;
          return;
        }
        lastSig = sig;
        thread.querySelectorAll(":scope > .empty").forEach((n) => n.remove());
        patchThread(items);
        if (painted !== current) pinBottom();
        emit("trae_sessions_paint", {
          dur_ms: performance.now() - t0,
          payload: {
            n: items.length,
            kind: String(kind || "full").slice(0, 32),
            chars: liveEvents.length,
            bytes: thread.childElementCount,
            nodes: thread.querySelectorAll("*").length,
            value: bundles,
          },
        });
        emitMdMeter(kind || "full");
        emitLayout(kind || "paint");
        markTtfp(kind);
        if (!(followTail || painted !== current) && grew) {
          pendingNew = true;
          syncFollowBtn();
        }
        painted = current;
      } catch (err) {
        emit("trae_sessions_error", { ok: false, payload: { reason: "paint" } });
        thread.innerHTML = `<div class="empty">渲染对话失败${err && err.message ? " · " + esc(err.message) : ""}</div>`;
      }
    }

    async function hydrateSlimTools() {
      const t0 = performance.now();
      const gen = eventsGen;
      const items = focusImRows(imMessagesFromEvents(liveEvents));
      const ids = [];
      for (const item of items) {
        if (item.type !== "focus") continue;
        const row = item.row;
        const e = row && row.event;
        if (!e || row.role !== "tool") continue;
        if (e.tool_input != null || e.tool_response != null) continue;
        if (e.event_id) ids.push(e.event_id);
      }
      if (!ids.length) return;
      let n = 0;
      const loadOne = async (id) => {
        if (gen !== eventsGen) return;
        try {
          const d = await (await fetch(apiUrl("/api/event?id=" + encodeURIComponent(id)))).json();
          const ev = d.event;
          if (!ev || !ev.event_id) return;
          const i = liveEvents.findIndex((x) => x.event_id === ev.event_id);
          if (i >= 0) liveEvents[i] = ev;
          n += 1;
        } catch (_) {}
      };
      const pool = 4;
      for (let i = 0; i < ids.length; i += pool) {
        if (gen !== eventsGen) return;
        await Promise.all(ids.slice(i, i + pool).map(loadOne));
      }
      if (n && gen === eventsGen) paintFromLive("patch");
      if (gen === eventsGen && ids.length) {
        emit("trae_sessions_tools", { dur_ms: performance.now() - t0, ok: n === ids.length, payload: { n: ids.length, kind: "slim" } });
      }
    }

    async function loadEvents(view, opts) {
      const paint = !opts || opts.paint !== false;
      if (!canFetch(load)) {
        emit("trae_sessions_skip", {
          ok: false,
          payload: { reason: load.paused ? "paused" : "nofetch", kind: String(view || "full").slice(0, 32), n: liveEvents.length, phase: load.phase },
        });
        return;
      }
      const gen = ++eventsGen;
      const sid = current;
      const kind = view === "tools" ? "tools" : view === "beats" ? "beats" : "full";
      if (eventsAbort && kind !== "tools") {
        try { eventsAbort.abort(); } catch (_) {}
      }
      const ac = new AbortController();
      if (kind !== "tools") eventsAbort = ac;
      const q = (document.getElementById("q") || {}).value || "";
      const params = new URLSearchParams();
      // Tool index is the whole timeline. limit=200 here is CLIENT_CAP:
      // historical turns keep Stop conclusions and drop every Pre/PostToolUse.
      if (kind !== "tools") params.set("limit", "200");
      if (sid) params.set("session_id", sid);
      if (String(q).trim()) params.set("q", String(q).trim());
      else if (kind === "beats" || kind === "tools") params.set("view", kind);
      if (!sid) {
        paintFromLive("full");
        return;
      }
      if (!liveEvents.length && kind !== "tools") {
        if (!thread.querySelector(":scope > .thread-block, :scope > [data-key]")) {
          thread.innerHTML = '<div class="empty">加载对话…</div>';
        }
      }
      emit("trae_sessions_load", { payload: { kind, phase: "start" } });
      try {
        const data = await netJson(kind, apiUrl("/api/events?" + params), { signal: ac.signal });
        if (gen !== eventsGen || current !== sid) return;
        mergeIncoming(data.events || []);
        if (paint) paintFromLive(kind);
        emit("trae_sessions_load", { payload: { n: liveEvents.length, kind, phase: "end" } });
        return data;
        if (kind !== "tools") dispatch({ type: "resync_ok" });
      } catch (err) {
        if (err && err.name === "AbortError") return;
        if (gen !== eventsGen) return;
        emit("trae_sessions_error", { payload: { reason: "events" } });
        dispatch({ type: "resync_fail", reason: "events" });
        if (!liveEvents.length) {
          lastSig = "";
          thread.innerHTML = `<div class="empty">加载对话失败${err && err.message ? " · " + esc(err.message) : ""}</div>`;
        }
      }
    }

    function hookIsBeat(meta) {
      const h = String((meta && meta.hook_event) || "");
      const tool = String((meta && meta.tool_name) || "");
      return h === "UserPromptSubmit" || h === "Stop" || h === "Notification"
        || tool === "AskUserQuestion";
    }
    async function ingestHookIds(ids) {
      const uniq = [...new Set(ids.filter(Boolean))];
      if (!uniq.length || !current || !canIngest(load)) return;
      const batch = uniq.length > 16 ? uniq.slice(-16) : uniq;
      if (uniq.length > 16) {
        emit("trae_sessions_load", { payload: { n: uniq.length, kind: "patch", reason: "overflow" } });
      }
      let added = 0;
      for (const id of batch) {
        if (liveIds.has(id)) continue;
        const meta = pendingHookMeta.get(id) || {};
        if (meta.session_id && current && meta.session_id !== current) continue;
        liveIds.add(id);
        liveEvents.push({
          event_id: id,
          ts: meta.ts || "",
          session_id: meta.session_id || current,
          hook_event: meta.hook_event || "PostToolUse",
          tool_name: meta.tool_name || "",
          prompt: meta.preview || "",
          notification_message: meta.notification_message || "",
          notification_type: meta.notification_type || "",
        });
        added += 1;
      }
      if (added) paintFromLive("patch");
    }

    async function loadThreadPair() {
      await loadEvents("beats", { paint: false });
      if (canFetch(load)) await loadEvents("tools", { paint: false });
      if (current && liveEvents.length) paintFromLive("pair");
      else if (current) paintFromLive("beats");
      if (canFetch(load)) await hydrateSlimTools();
      if (canFetch(load)) dispatch({ type: "resync_ok" });
    }
    $("q").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") loadThreadPair();
    });
    jumpBot.addEventListener("click", () => {
      markFollow(true);
      pinBottomSoon();
    });
    const scheduleList = () => {
      if (!canFetch(load) || listTimer) return;
      listTimer = setTimeout(async () => {
        listTimer = 0;
        if (!canFetch(load)) return;
        await loadHealth();
        const r = await loadSessions();
        if ((r && r.switched) || (current && !liveEvents.length)) {
          await loadThreadPair();
        }
      }, 1000);
    };
    const runResync = async () => {
      if (!canFetch(load)) {
        emit("trae_sessions_skip", {
          ok: false,
          payload: { reason: load.paused ? "paused" : "nofetch", kind: "resync", phase: load.phase },
        });
        return;
      }
      dispatch({ type: "resync_start" });
      try {
        loadHealth();
        await loadSessions();
        if (current) {
          await loadThreadPair();
        } else dispatch({ type: "resync_ok" });
      } catch (err) {
        emit("trae_sessions_error", { payload: { reason: "resync" } });
        dispatch({ type: "resync_fail", reason: "resync" });
      }
    };
    const scheduleResync = () => {
      if (!canFetch(load) || resyncTimer) return;
      resyncTimer = setTimeout(async () => {
        resyncTimer = 0;
        await runResync();
      }, 0);
    };
    const scheduleHookPaint = () => {
      if (!canIngest(load) || hookPaintTimer) return;
      hookPaintTimer = setTimeout(() => {
        hookPaintTimer = 0;
        const ids = pendingHookIds;
        pendingHookIds = [];
        scheduleList();
        ingestHookIds(ids);
      }, 40);
    };
    const setupSSE = () => {
      if (!canFetch(load)) return;
      if (es && es.readyState !== EventSource.CLOSED) return;
      try { if (es) es.close(); } catch (_) {}
      es = new EventSource(apiUrl("/api/stream"));
      es.onopen = () => dispatch({ type: "stream_open" });
      es.onmessage = (ev) => {
        let d;
        try { d = JSON.parse(ev.data); } catch (_) { return; }
        if (!d || d.type === "ping" || d.type === "connected") return;
        if (d.type === "resync_required") {
          emit("trae_sessions_resync", { payload: { reason: "overflow" } });
          lastSig = "";
          lastListSig = "";
          dispatch({ type: "overflow" });
          return;
        }
        if (d.type === "session_pinned") {
          lastListSig = "";
          loadSessions();
          return;
        }
        if (d.type === "hook_event") {
          if (!canIngest(load)) return;
          emit("trae_sessions_hook", { payload: { n: 1 } });
          if (d.event_id) {
            pendingHookIds.push(d.event_id);
            pendingHookMeta.set(d.event_id, d);
          }
          if (followLatest && d.session_id && d.session_id !== current) {
            current = d.session_id;
            lastSig = "";
            painted = "";
            pendingHookIds = [];
            markFollow(true);
            dispatch({ type: "overflow" });
            return;
          }
          scheduleHookPaint();
        }
      };
    };
    window.addEventListener("message", (ev) => {
      const t = ev && ev.data && ev.data.type;
      if (t === "clipvault-sessions-pause") dispatch({ type: "pause", reason: "parent" });
      if (t === "clipvault-sessions-resume") dispatch({ type: "resume", reason: "parent" });
      if (t === "clipvault-sessions-settled") {
        layoutReady = true;
        emitLayout("settled");
        if (thread.querySelector(":scope > [data-key]")) {
          markTtfp("settle");
        } else if (canFetch(load)) {
          scheduleResync();
        } else if (current && liveEvents.length) {
          try { paintFromLive("settle"); markTtfp("settle"); } catch (_) {}
        }
      }
    });
    if (typeof ResizeObserver !== "undefined") {
      try {
        let layoutTick = 0;
        const ro = new ResizeObserver(() => {
          if (layoutTick) return;
          layoutTick = window.setTimeout(() => {
            layoutTick = 0;
            emitLayout("resize");
            if (layoutReady && current && liveEvents.length && !thread.querySelector(":scope > [data-key]")) {
              try { paintFromLive("resize"); } catch (_) {}
            }
          }, 120);
        });
        const app = document.querySelector(".app");
        if (app) ro.observe(app);
        if (thread) ro.observe(thread);
      } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !load.paused) dispatch({ type: "resume" });
    });
    window.addEventListener("pageshow", () => {
      if (!load.paused) dispatch({ type: "resume" });
    });
    window.addEventListener("online", () => {
      if (!load.paused) dispatch({ type: "resume" });
    });
    markFollow(true);
    emit("trae_sessions_boot", { payload: { phase: "start" } });
    emitLayout("boot");
    dispatch({ type: "boot" });
  </script>
</body>
</html>
