[package]
name = "cvlm-core"
version = "0.1.0"
edition = "2021"
description = "ClipVault personal-LM: bundle loader (config+tokenizer+safetensors) + candle GPT inference. Shared by cv-lm and any ClipVault applet."

[dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = "0.11"
regex = "1"
serde_json = "1"
